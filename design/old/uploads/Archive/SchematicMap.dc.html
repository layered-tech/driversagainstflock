  <style>
    [data-view="satellite"]{ --map-land:#3a3f2e; --map-land-alt:#454a38; --map-water:#1e3046; --map-park:#36492c; --map-road:#e9e4d6; --map-road-minor:rgba(233,228,214,0.22); }
  </style>
</helmet>
<div data-view="{{ view }}" style="position:absolute; inset:0; overflow:hidden; background:var(--map-land);">
  <svg preserveAspectRatio="xMidYMid slice" style="position:absolute; inset:0; width:100%; height:100%; display:block;" viewBox="0 0 600 900">
    <!-- land base -->
    <rect fill="var(--map-land)" height="900" width="600" x="0" y="0"></rect>
    <!-- soft land-alt districts for subtle variety -->
    <rect fill="var(--map-land-alt)" height="240" rx="10" width="230" x="180" y="320"></rect>
    <rect fill="var(--map-land-alt)" height="150" rx="10" width="150" x="60" y="120"></rect>
    <!-- water: top-right bay -->
    <path d="M600 -20 L600 320 C 520 312, 470 240, 470 158 C 470 86, 548 44, 524 -20 Z" fill="var(--map-water)"></path>
    <!-- parks -->
    <path d="M-20 640 C 90 612, 210 656, 232 760 C 248 842, 150 928, 40 928 L -20 928 Z" fill="var(--map-park)"></path>
    <ellipse cx="470" cy="700" fill="var(--map-park)" rx="92" ry="70"></ellipse>
    <!-- minor road grid -->
    <g stroke="var(--map-road-minor)" stroke-linecap="round" stroke-width="6">
      <line x1="80" x2="80" y1="-20" y2="920"></line>
      <line x1="185" x2="185" y1="-20" y2="920"></line>
      <line x1="295" x2="295" y1="-20" y2="920"></line>
      <line x1="405" x2="405" y1="-20" y2="920"></line>
      <line x1="515" x2="515" y1="-20" y2="920"></line>
      <line x1="-20" x2="620" y1="110" y2="110"></line>
      <line x1="-20" x2="620" y1="215" y2="215"></line>
      <line x1="-20" x2="620" y1="325" y2="325"></line>
      <line x1="-20" x2="620" y1="445" y2="445"></line>
      <line x1="-20" x2="620" y1="560" y2="560"></line>
      <line x1="-20" x2="620" y1="685" y2="685"></line>
      <line x1="-20" x2="620" y1="800" y2="800"></line>
    </g>
    <!-- arterials: thicker white roads -->
    <g fill="none" stroke="var(--map-road)" stroke-linecap="round" stroke-width="14">
      <path d="M300 -20 C 322 200, 276 420, 312 640 C 332 770, 300 860, 300 920"></path>
      <path d="M-20 268 C 180 300, 360 372, 640 352"></path>
      <path d="M-20 612 C 200 588, 420 650, 640 600"></path>
    </g>
  </svg>
</div>

</x-dc>
<script data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:600}}" type="text/x-dc"></script>
</body>
</html>
