appId: com.anonymous.drivefree.dev
---
- setLocation:
    latitude: 30.26715
    longitude: -97.74035
- launchApp:
    clearState: true
    stopApp: true
    permissions:
      all: allow
- runFlow:
    when:
      true: ${typeof MAESTRO_EXPO_DEV_CLIENT_URL !== 'undefined' && MAESTRO_EXPO_DEV_CLIENT_URL.length > 0}
    file: open-expo-dev-client-after-clear.yml
- extendedWaitUntil:
    visible:
      id: 'map-search-input-map'
    timeout: 120000
- openLink: "${'driversagainstflock://e2e-mocks?auth=' + (typeof CONTRIBUTE_AUTH === 'undefined' ? '1' : CONTRIBUTE_AUTH)}"
- extendedWaitUntil:
    visible:
      id: 'map-contribute-button'
    timeout: 30000
# First-use guidance starts only when the user tries to contribute.
- assertNotVisible:
    id: 'contribute-tour-.*'
- tapOn:
    id: 'map-contribute-button'
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible:
      id: 'contribute-tour-start'
    timeout: 10000
