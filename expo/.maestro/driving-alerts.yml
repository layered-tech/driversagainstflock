appId: com.anonymous.drivefree.dev
name: Driving Alert Cards
tags:
  - map
  - directions
  - visual
---
- setLocation:
    latitude: 30.2672
    longitude: -97.7431
- launchApp:
    stopApp: true
    permissions:
      all: allow
- runFlow:
    when:
      true: ${typeof MAESTRO_EXPO_DEV_CLIENT_URL !== 'undefined' && MAESTRO_EXPO_DEV_CLIENT_URL.length > 0}
    commands:
      - openLink: ${MAESTRO_EXPO_DEV_CLIENT_URL}
- extendedWaitUntil:
    visible:
      id: 'map-search-input-map'
    timeout: 30000
- openLink: 'driversagainstflock://e2e-mocks?drivingAlerts=police'
- extendedWaitUntil:
    visible:
      id: 'map-search-directions-button-map'
    timeout: 10000

- tapOn:
    id: 'map-search-directions-button-map'
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: 'map-directions-destination-input-map'
    timeout: 10000
- tapOn:
    id: 'map-directions-destination-input-map'
- inputText: 'Austin Central Library'
- extendedWaitUntil:
    visible:
      id: 'map-directions-search-result-0-map'
    timeout: 30000
- tapOn:
    id: 'map-directions-search-result-0-map'
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: 'map-directions-submit-button-map'
      enabled: true
    timeout: 30000
- tapOn:
    id: 'map-directions-submit-button-map'
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: 'directions-route-start-driving-button'
    timeout: 60000
- tapOn:
    id: 'directions-route-start-driving-button'
    retryTapIfNoChange: true

- extendedWaitUntil:
    visible:
      id: 'driving-upcoming-alert-title'
    timeout: 30000
- assertVisible:
    id: 'driving-upcoming-alert-title'
    text: 'Police reported'
- assertVisible:
    id: 'driving-upcoming-alert-track'
- takeScreenshot: ${MAESTRO_ARTIFACTS_DIR + '/daf-driving-alert-police'}

- openLink: 'driversagainstflock://e2e-mocks?drivingAlerts=alpr'
- extendedWaitUntil:
    visible:
      id: 'driving-upcoming-alert-title'
    timeout: 10000
- assertVisible:
    id: 'driving-upcoming-alert-title'
    text: 'ALPR camera'
- assertVisible:
    text: 'Flock · on your route'
- takeScreenshot: ${MAESTRO_ARTIFACTS_DIR + '/daf-driving-alert-alpr'}

- openLink: 'driversagainstflock://e2e-mocks?drivingAlerts=combined'
- extendedWaitUntil:
    visible:
      id: 'driving-upcoming-alert-police'
    timeout: 10000
- assertVisible:
    id: 'driving-upcoming-alert-alpr'
- assertVisible:
    id: 'driving-upcoming-alert-police-track'
- assertVisible:
    id: 'driving-upcoming-alert-alpr-track'
- takeScreenshot: ${MAESTRO_ARTIFACTS_DIR + '/daf-driving-alert-combined'}
- tapOn:
    id: 'driving-upcoming-alert-dismiss'
- assertNotVisible:
    id: 'driving-upcoming-alert'
- tapOn:
    id: 'driving-cancel-route-button'
    retryTapIfNoChange: true
- tapOn:
    id: 'place-details-close-button'
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: 'map-search-input-map'
    timeout: 10000
