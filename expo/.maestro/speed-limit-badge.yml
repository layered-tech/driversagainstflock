appId: com.anonymous.drivefree.dev
name: Speed Limit Badge Design
tags:
  - map
  - directions
  - visual
---
- setLocation:
    latitude: 43.12152
    longitude: -88.24447
- launchApp:
    clearState: true
    stopApp: true
    permissions:
      all: allow
- runFlow:
    when:
      true: ${typeof MAESTRO_EXPO_DEV_CLIENT_URL !== 'undefined' && MAESTRO_EXPO_DEV_CLIENT_URL.length > 0}
    file: subflows/open-expo-dev-client-after-clear.yml
- runFlow: subflows/dismiss-first-launch-support.yml
- waitForAnimationToEnd
- runFlow:
    when:
      visible:
        id: 'place-details-close-button'
    commands:
      - tapOn:
          id: 'place-details-close-button'
          retryTapIfNoChange: true
- runFlow:
    when:
      visible:
        id: 'directions-route-back-button'
    commands:
      - tapOn:
          id: 'directions-route-back-button'
          retryTapIfNoChange: true
- runFlow:
    when:
      visible:
        id: 'driving-cancel-route-button'
    commands:
      - tapOn:
          id: 'driving-cancel-route-button'
          retryTapIfNoChange: true
- runFlow:
    when:
      visible:
        id: 'exit-free-drive-button'
    commands:
      - tapOn:
          id: 'exit-free-drive-button'
          retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: 'map-search-input-map'
    timeout: 120000
- openLink: 'driversagainstflock://e2e-mocks'
- extendedWaitUntil:
    visible:
      id: 'map-search-directions-button-map'
    timeout: 10000
- setLocation:
    latitude: 43.12152
    longitude: -88.24447

- tapOn:
    id: 'map-search-directions-button-map'
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: 'map-directions-destination-input-map'
    timeout: 10000
- tapOn:
    id: 'map-directions-start-input-map'
- extendedWaitUntil:
    visible:
      id: 'map-directions-current-location-map'
    timeout: 30000
- tapOn:
    id: 'map-directions-current-location-map'
- tapOn:
    id: 'map-directions-destination-input-map'
- inputText: '377 Parkland Ct'
- extendedWaitUntil:
    visible:
      id: 'map-directions-search-result-0-map'
    timeout: 30000
- tapOn:
    id: 'map-directions-search-result-0-map'
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: 'map-directions-submit-button-map'
      enabled: true
    timeout: 30000
- assertNotVisible:
    id: 'directions-route-sheet-presented'
- tapOn:
    id: 'map-directions-submit-button-map'
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: 'directions-route-sheet-presented'
    timeout: 60000
- assertVisible:
    id: 'directions-route-start-driving-button'
- tapOn:
    id: 'directions-route-start-driving-button'
    retryTapIfNoChange: true
- extendedWaitUntil:
    notVisible:
      id: 'directions-route-sheet-presented'
    timeout: 10000
- extendedWaitUntil:
    visible: 'expo-foreground-location-watch'
    timeout: 30000
- travel:
    points:
      - '43.12152, -88.24447'
      - '43.12116, -88.244495'
    speed: 12
- setLocation:
    latitude: 43.12116
    longitude: -88.244495
- extendedWaitUntil:
    visible: 'e2e-pewaukee:0:forward'
    timeout: 60000

- extendedWaitUntil:
    visible:
      id: 'driving-speed-limit-sign'
    timeout: 30000
- copyTextFrom:
    id: 'driving-speed-limit-value'
- assertTrue: ${maestro.copiedText == '45'}
- assertVisible:
    id: 'driving-speed-limit-sign-current-speed'
- copyTextFrom:
    id: 'driving-speed-limit-sign-current-speed-value'
- assertTrue: ${maestro.copiedText == '51'}
- takeScreenshot: ${MAESTRO_ARTIFACTS_DIR + '/daf-speed-limit-badge-45-over-51'}
