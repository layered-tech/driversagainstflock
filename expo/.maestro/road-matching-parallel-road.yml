appId: com.anonymous.drivefree.dev
name: In-house Road Matching Parallel Roads
tags:
  - map
  - road-matching
---
- setLocation:
    latitude: 30.26760492387431
    longitude: -97.7488205067107
- launchApp:
    clearState: true
    clearKeychain: true
    stopApp: true
    permissions:
      all: allow
- runFlow:
    when:
      true: ${typeof MAESTRO_EXPO_DEV_CLIENT_URL !== 'undefined' && MAESTRO_EXPO_DEV_CLIENT_URL.length > 0}
    file: subflows/open-expo-dev-client-after-clear.yml
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: 'map-search-input-map'
    timeout: 30000
- openLink: 'driversagainstflock://e2e-mocks'
- extendedWaitUntil:
    visible:
      id: 'start-free-drive-button'
    timeout: 10000
- tapOn:
    id: 'start-free-drive-button'
    retryTapIfNoChange: true
- setLocation:
    latitude: 30.26760492387431
    longitude: -97.7483004606461
- extendedWaitUntil:
    visible: '-97.7483005,30.2676049'
    timeout: 60000
- extendedWaitUntil:
    visible: 'e2e-frontage:0:forward'
    timeout: 30000
- copyTextFrom:
    id: 'e2e-road-matching-edge-id'
- assertTrue: ${maestro.copiedText == 'e2e-frontage:0:forward'}
- runFlow:
    when:
      visible:
        id: 'driving-recenter-button'
    commands:
      - tapOn:
          id: 'driving-recenter-button'
- extendedWaitUntil:
    visible: 'native-puck-proof-ready'
    timeout: 60000
- copyTextFrom:
    id: 'e2e-native-puck-proof'
- assertTrue: ${maestro.copiedText == 'true'}
- extendedWaitUntil:
    visible: 'native-puck-proof-ready'
    timeout: 60000
- copyTextFrom:
    id: 'e2e-native-3d-puck-proof'
- assertTrue: ${maestro.copiedText == 'true'}
- copyTextFrom:
    id: 'e2e-native-puck-kind'
- assertTrue: ${maestro.copiedText == '3d'}
- copyTextFrom:
    id: 'e2e-native-puck-model-uri'
- assertTrue: ${maestro.copiedText.match(/navigation_puck\.glb$/)}
- assertVisible:
    id: 'e2e-native-puck-model-scale'
- copyTextFrom:
    id: 'e2e-native-puck-model-rotation'
- assertTrue: ${maestro.copiedText == '0,0,0'}
- copyTextFrom:
    id: 'e2e-native-puck-scale-mode'
- assertTrue: ${maestro.copiedText == 'map'}
- copyTextFrom:
    id: 'e2e-native-puck-emissive-strength'
- assertTrue: ${maestro.copiedText == '1'}
- copyTextFrom:
    id: 'e2e-native-puck-cast-shadows'
- assertTrue: ${maestro.copiedText == 'false'}
- copyTextFrom:
    id: 'e2e-native-puck-receive-shadows'
- assertTrue: ${maestro.copiedText == 'false'}
- copyTextFrom:
    id: 'e2e-native-puck-location-enabled'
- assertTrue: ${maestro.copiedText == 'true'}
- copyTextFrom:
    id: 'e2e-native-puck-bearing'
- assertTrue: ${maestro.copiedText == 'heading'}
- copyTextFrom:
    id: 'e2e-native-puck-bearing-enabled'
- assertTrue: ${maestro.copiedText == 'true'}
- copyTextFrom:
    id: 'e2e-native-puck-model-layer'
- assertTrue: ${maestro.copiedText == 'true'}
- copyTextFrom:
    id: 'e2e-native-puck-model-source'
- assertTrue: ${maestro.copiedText == 'true'}
- copyTextFrom:
    id: 'e2e-native-puck-indicator-layer'
- assertTrue: ${maestro.copiedText == 'false'}
- copyTextFrom:
    id: 'e2e-native-puck-rendered-at-snapped'
- assertTrue: ${maestro.copiedText == 'true'}
- copyTextFrom:
    id: 'e2e-native-puck-model-byte-length'
- assertTrue: ${maestro.copiedText == '21636'}
- copyTextFrom:
    id: 'e2e-native-puck-model-sha256'
- assertTrue: ${maestro.copiedText == 'ab6a662ad8d0696f4a763ce364a1f73c0d4c5a56361baa4ab57644e85381fccc'}
- copyTextFrom:
    id: 'e2e-road-matching-state'
- assertTrue: ${maestro.copiedText == 'matched'}
- copyTextFrom:
    id: 'e2e-road-matching-source'
- assertTrue: ${maestro.copiedText == 'expo-foreground-location-watch'}
- copyTextFrom:
    id: 'e2e-road-matching-provider'
- assertTrue: ${maestro.copiedText == 'in-house-road-matcher'}
- copyTextFrom:
    id: 'e2e-road-matching-raw-coordinate'
- assertTrue: ${maestro.copiedText == '-97.7483005,30.2676049'}
- copyTextFrom:
    id: 'e2e-road-matching-coordinate'
- assertTrue: ${maestro.copiedText == '-97.7483005,30.2675149'}
- copyTextFrom:
    id: 'e2e-road-matching-speed-limit'
- assertTrue: ${maestro.copiedText == '25'}
- copyTextFrom:
    id: 'e2e-road-look-ahead-edge-ids'
- assertTrue: ${maestro.copiedText == 'e2e-frontage:0:forward,e2e-frontage:1:forward'}
- copyTextFrom:
    id: 'e2e-native-puck-provider-owned'
- assertTrue: ${maestro.copiedText == 'true'}
- copyTextFrom:
    id: 'e2e-native-puck-camera-following'
- assertTrue: ${maestro.copiedText == 'true'}
- runFlow:
    when:
      platform: Android
    commands:
      - copyTextFrom:
          id: 'e2e-native-puck-provider-coordinate'
      - assertTrue: ${maestro.copiedText == '-97.7483005,30.2675149'}
      - copyTextFrom:
          id: 'e2e-native-puck-provider-at-snapped'
      - assertTrue: ${maestro.copiedText == 'true'}
      - copyTextFrom:
          id: 'e2e-native-puck-provider-at-raw'
      - assertTrue: ${maestro.copiedText == 'false'}
      - copyTextFrom:
          id: 'e2e-native-puck-proof-source'
      - assertTrue: ${maestro.copiedText == 'native-3d-puck'}
- runFlow:
    when:
      platform: iOS
    commands:
      - copyTextFrom:
          id: 'e2e-native-puck-proof-source'
      - assertTrue: ${maestro.copiedText == 'rendered-query-3d'}
- copyTextFrom:
    id: 'driving-speed-limit-value'
- assertTrue: ${maestro.copiedText == '25'}
- copyTextFrom:
    id: 'e2e-road-graph-load-count'
- assertTrue: ${maestro.copiedText == '1'}
