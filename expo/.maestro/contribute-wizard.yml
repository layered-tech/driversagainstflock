appId: com.anonymous.drivefree.dev
name: Contribution Tour First Submission
tags:
  - contribute
  - contribute-tour
  - map
---
- runFlow: subflows/contribute-tour-setup.yml
- runFlow: subflows/contribute-tour-place-camera.yml

# Every camera spotlight must appear, including Back remeasuring its target.
- runFlow:
    file: subflows/contribute-tour-tip.yml
    env:
      TOUR_STEP: camera-details
      TOUR_TITLE: Describe what you can verify
- extendedWaitUntil:
    visible:
      id: 'contribute-tour-manufacturer'
    timeout: 10000
- tapOn:
    id: 'contribute-tour-back-manufacturer'
    retryTapIfNoChange: false
- runFlow:
    file: subflows/contribute-tour-tip.yml
    env:
      TOUR_STEP: camera-details
      TOUR_TITLE: Describe what you can verify
- runFlow:
    file: subflows/contribute-tour-tip.yml
    env:
      TOUR_STEP: manufacturer
      TOUR_TITLE: Check the manufacturer
- runFlow:
    file: subflows/contribute-tour-tip.yml
    env:
      TOUR_STEP: operator
      TOUR_TITLE: Who runs this camera?
- runFlow:
    file: subflows/contribute-tour-tip.yml
    env:
      TOUR_STEP: directions
      TOUR_TITLE: Show where the camera looks
- runFlow:
    file: subflows/contribute-tour-tip.yml
    env:
      TOUR_STEP: mount
      TOUR_TITLE: What is it mounted on?
- assertNotVisible:
    id: 'contribute-tour-.*'
- assertVisible:
    id: 'contribute-camera-details-screen'
# Scroll at the edge so the compass does not consume the gesture.
- repeat:
    times: 2
    commands:
      - swipe:
          start: '95%,35%'
          end: '95%,80%'
          duration: 500
- scrollUntilVisible:
    element:
      id: 'contribute-operator-input'
    direction: DOWN
    centerElement: true
- tapOn:
    id: 'contribute-operator-input'
- inputText: 'Maestro first camera operator'
- pressKey: Enter
- copyTextFrom:
    id: 'contribute-operator-input'
- assertTrue: ${maestro.copiedText == 'Maestro first camera operator'}
# Scroll beside the interactive map/dial so it cannot consume the gesture.
- swipe:
    start: '95%,80%'
    end: '95%,30%'
    duration: 500
- scrollUntilVisible:
    element:
      id: 'contribute-direction-dial'
    direction: DOWN
    visibilityPercentage: 60
- assertVisible:
    id: 'contribute-direction-dial-controls'
- scrollUntilVisible:
    element:
      id: 'contribute-mount-pole'
    direction: DOWN
- tapOn:
    id: 'contribute-mount-pole'
    retryTapIfNoChange: false
- tapOn:
    id: 'contribute-next-changeset-button'
    retryTapIfNoChange: false
- assertVisible: '1 change staged'
- tapOn:
    id: 'contribute-keep-editing'
    retryTapIfNoChange: false
- swipe:
    start: '65%,30%'
    end: '35%,30%'
    duration: 500
- tapOn:
    id: 'contribute-add-camera-button'
    retryTapIfNoChange: false
- assertNotVisible:
    id: 'contribute-tour-.*'
- tapOn:
    id: 'contribute-next-changeset-button'
    retryTapIfNoChange: false
- assertVisible: '2 changes staged'
- tapOn:
    id: 'contribute-pin-remove-1'
    retryTapIfNoChange: false
- assertVisible: '1 change staged'
- tapOn:
    id: 'contribute-keep-editing'
    retryTapIfNoChange: false
- tapOn:
    id: 'contribute-add-camera-button'
    retryTapIfNoChange: false
- tapOn:
    id: 'contribute-next-changeset-button'
    retryTapIfNoChange: false
- assertVisible: '2 changes staged'
- tapOn:
    id: 'contribute-next-details-button'
    retryTapIfNoChange: false
- runFlow:
    file: subflows/contribute-tour-tip.yml
    env:
      TOUR_STEP: changeset
      TOUR_TITLE: Tell other mappers what changed
- runFlow:
    file: subflows/contribute-tour-tip.yml
    env:
      TOUR_STEP: source
      TOUR_TITLE: Where did the information come from?
# Guidance cannot bypass the required real changeset comment.
- assertVisible:
    id: 'contribute-next-review-button'
    enabled: false
- tapOn:
    id: 'contribute-comment-input'
- inputText: 'Added 2 Flock Safety ALPR cameras for the e2e flow.'
- tapOn:
    text: 'Say what changed and why — other mappers read this.'
    retryTapIfNoChange: false
- tapOn:
    id: 'contribute-source-local'
    retryTapIfNoChange: false
- assertVisible: '2 changes'
- tapOn:
    id: 'contribute-next-review-button'
    retryTapIfNoChange: false

- runFlow:
    file: subflows/contribute-tour-tip.yml
    env:
      TOUR_STEP: review
      TOUR_TITLE: Check your contribution before publishing
- runFlow:
    file: subflows/contribute-tour-tip.yml
    env:
      TOUR_STEP: publish
      TOUR_TITLE: Publish when you’re ready
- assertVisible: 'Review & publish'
- assertVisible: 'Added 2 Flock Safety ALPR cameras for the e2e flow.'
- assertVisible: 'DAF Mobile'
- assertNotVisible: 'Changeset published'
# Dismissing the publish tip never submits; only this real button does.
- tapOn:
    id: 'contribute-publish-button'
    retryTapIfNoChange: false
- runFlow:
    file: subflows/contribute-tour-tip.yml
    env:
      TOUR_STEP: published
      TOUR_TITLE: You’ve made your first contribution
- assertVisible: 'Changeset published'
- assertVisible: 'changeset/171,224,908'
- assertVisible:
    id: 'contribute-published-node-0'
- assertVisible:
    id: 'contribute-published-node-1'
- tapOn:
    id: 'contribute-see-on-map-button'
    retryTapIfNoChange: false

# Completion remains saved across an app restart and a second submission.
- runFlow: subflows/contribute-tour-relaunch.yml
- assertVisible:
    id: 'contribute-start-editing-button'
- assertNotVisible:
    id: 'contribute-tour-.*'
- tapOn:
    id: 'contribute-start-editing-button'
    retryTapIfNoChange: false
- assertVisible:
    id: 'contribute-placement-sheet'
- assertNotVisible:
    id: 'contribute-tour-.*'
- tapOn:
    id: 'contribute-add-camera-button'
    retryTapIfNoChange: false
- assertVisible:
    id: 'contribute-camera-details-screen'
- assertNotVisible:
    id: 'contribute-tour-.*'
