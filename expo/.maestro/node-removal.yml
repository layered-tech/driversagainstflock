appId: com.anonymous.drivefree.dev
name: OSM Node Removal Mocked
tags:
  - map
  - contribute
  - node-removal
---
- runFlow: subflows/contribute-tour-setup.yml
- tapOn:
    id: 'contribute-tour-skip-start'
    retryTapIfNoChange: false
- tapOn:
    id: 'contribute-start-editing-button'
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible:
      id: 'contribute-placement-sheet'
    timeout: 10000
- tapOn:
    id: 'map-marker-0-map'
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible:
      id: 'editing-camera-details'
    timeout: 10000
- tapOn:
    id: 'marker-details-delete-node-button'
    retryTapIfNoChange: false
- assertVisible:
    id: 'remove-camera-sheet'
- assertVisible:
    id: 'remove-camera-title'
- copyTextFrom:
    id: 'remove-camera-title'
- assertTrue: ${maestro.copiedText == 'Delete this camera?'}
- tapOn:
    id: 'remove-camera-cancel-button'
    retryTapIfNoChange: false
- assertVisible:
    id: 'contribute-add-camera-button'
- assertNotVisible:
    id: 'contribute-placement-sheet-title'
- openLink: 'driversagainstflock://edits/1234567890?action=remove'
- extendedWaitUntil:
    visible:
      id: 'remove-camera-sheet'
    timeout: 10000
- tapOn:
    id: 'remove-camera-reason-duplicate'
    retryTapIfNoChange: false
- tapOn:
    id: 'remove-camera-confirm-button'
    retryTapIfNoChange: false
- assertVisible: '1 change staged'
- tapOn:
    id: 'contribute-undo-removal-1234567890'
    retryTapIfNoChange: false
- assertVisible:
    id: 'contribute-add-camera-button'
- openLink: 'driversagainstflock://edits/1234567890?action=remove'
- extendedWaitUntil:
    visible:
      id: 'remove-camera-sheet'
    timeout: 10000
- tapOn:
    id: 'remove-camera-confirm-button'
    retryTapIfNoChange: false
- assertVisible: '1 change staged'
- tapOn:
    id: 'contribute-keep-editing'
    retryTapIfNoChange: false
- openLink: 'driversagainstflock://edits/1234567890'
- assertVisible:
    id: 'contribute-next-changeset-button'
- tapOn:
    id: 'contribute-back-button'
    retryTapIfNoChange: false
- tapOn:
    id: 'contribute-next-details-button'
    retryTapIfNoChange: false
- tapOn:
    id: 'contribute-comment-input'
- inputText: 'Removed missing camera after survey'
- tapOn:
    text: 'Say what changed and why — other mappers read this.'
    retryTapIfNoChange: false
- tapOn:
    id: 'contribute-next-review-button'
    retryTapIfNoChange: false
- assertVisible:
    id: 'contribute-review-removal-1234567890'
- tapOn:
    id: 'contribute-publish-button'
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible:
      id: 'contribute-published-screen'
    timeout: 10000
- assertVisible: deleted
- tapOn:
    id: 'contribute-see-on-map-button'
    retryTapIfNoChange: false
- assertNotVisible:
    id: 'contribute-draft-count'
