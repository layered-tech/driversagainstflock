appId: com.anonymous.drivefree.dev
name: Map Layer Options Mocked
tags:
  - map
  - layers
---
- setLocation:
    latitude: 30.2672
    longitude: -97.7431
- launchApp:
    clearState: true
    stopApp: true
    permissions:
      all: allow
- runFlow:
    when:
      true: ${typeof MAESTRO_EXPO_DEV_CLIENT_URL !== 'undefined' && MAESTRO_EXPO_DEV_CLIENT_URL.length > 0}
    file: subflows/open-expo-dev-client-after-clear.yml
- extendedWaitUntil:
    visible:
      id: 'map-search-input-map'
    timeout: 30000
- openLink: 'driversagainstflock://e2e-mocks'
- extendedWaitUntil:
    visible:
      id: 'map-layer-button'
    timeout: 30000
- extendedWaitUntil:
    notVisible:
      id: 'map-settings-sheet'
    timeout: 1000

- tapOn:
    id: 'map-layer-button'
    retryTapIfNoChange: false
    waitToSettleTimeoutMs: 0
- extendedWaitUntil:
    visible:
      id: 'map-settings-sheet'
    timeout: 10000
- assertVisible: 'Map settings'
- takeScreenshot: ${MAESTRO_ARTIFACTS_DIR + '/daf-map-settings-open'}
- assertVisible:
    id: 'map-layer-option-standard'
- assertVisible:
    id: 'map-layer-option-standard-satellite'
- assertVisible:
    id: 'map-surveillance-markers-toggle'
    checked: true
- assertVisible:
    id: 'map-marker-clusters-toggle'
    checked: true
- assertVisible:
    id: 'map-camera-cones-toggle'
    checked: true
- assertVisible:
    id: 'map-traffic-toggle'
    checked: false
- assertVisible:
    id: 'map-police-alerts-toggle'
    checked: false
- assertVisible:
    id: 'map-prefer-private-routes-toggle'
    checked: false
- tapOn:
    id: 'map-surveillance-markers-toggle'
    retryTapIfNoChange: false
    waitToSettleTimeoutMs: 0
- assertVisible:
    id: 'map-surveillance-markers-toggle'
    checked: false
- assertVisible:
    id: 'map-marker-clusters-toggle'
    checked: false
- assertVisible:
    id: 'map-camera-cones-toggle'
    checked: false
- tapOn:
    id: 'map-surveillance-markers-toggle'
    retryTapIfNoChange: false
    waitToSettleTimeoutMs: 0
- tapOn:
    id: 'map-marker-clusters-toggle'
    retryTapIfNoChange: false
    waitToSettleTimeoutMs: 0
- tapOn:
    id: 'map-camera-cones-toggle'
    retryTapIfNoChange: false
    waitToSettleTimeoutMs: 0
- assertVisible:
    id: 'map-surveillance-markers-toggle'
    checked: true
- assertVisible:
    id: 'map-marker-clusters-toggle'
    checked: true
- assertVisible:
    id: 'map-camera-cones-toggle'
    checked: true
- tapOn:
    id: 'map-prefer-private-routes-toggle'
    retryTapIfNoChange: false
    waitToSettleTimeoutMs: 0
- assertVisible:
    id: 'map-prefer-private-routes-toggle'
    checked: true
- tapOn:
    id: 'map-prefer-private-routes-toggle'
    retryTapIfNoChange: false
    waitToSettleTimeoutMs: 0
- assertVisible:
    id: 'map-prefer-private-routes-toggle'
    checked: false
- tapOn:
    id: 'map-traffic-toggle'
    retryTapIfNoChange: false
    waitToSettleTimeoutMs: 0
- assertVisible:
    id: 'map-traffic-toggle'
    checked: true
- tapOn:
    id: 'map-traffic-toggle'
    retryTapIfNoChange: false
    waitToSettleTimeoutMs: 0
- assertVisible:
    id: 'map-traffic-toggle'
    checked: false
- tapOn:
    id: 'map-police-alerts-toggle'
    retryTapIfNoChange: false
    waitToSettleTimeoutMs: 0
- assertVisible:
    id: 'map-police-alerts-toggle'
    checked: true
- tapOn:
    id: 'map-police-alerts-toggle'
    retryTapIfNoChange: false
    waitToSettleTimeoutMs: 0
- assertVisible:
    id: 'map-police-alerts-toggle'
    checked: false

- tapOn:
    id: 'map-layer-option-standard-satellite'
    retryTapIfNoChange: false
    waitToSettleTimeoutMs: 0
- extendedWaitUntil:
    notVisible:
      id: 'map-settings-sheet'
    timeout: 1000
- extendedWaitUntil:
    visible: 'Map layer: Standard Satellite. Open map layer options'
    timeout: 10000
- tapOn:
    id: 'map-layer-button'
    retryTapIfNoChange: false
    waitToSettleTimeoutMs: 0
- extendedWaitUntil:
    visible:
      id: 'map-settings-sheet'
    timeout: 10000
- assertVisible:
    id: 'map-layer-option-standard-satellite'
    selected: true
- tapOn:
    id: 'map-layer-option-standard'
    retryTapIfNoChange: false
    waitToSettleTimeoutMs: 0
- extendedWaitUntil:
    notVisible:
      id: 'map-settings-sheet'
    timeout: 1000
- extendedWaitUntil:
    visible: 'Map layer: Standard. Open map layer options'
    timeout: 10000
- tapOn:
    id: 'map-layer-button'
    retryTapIfNoChange: false
    waitToSettleTimeoutMs: 0
- extendedWaitUntil:
    visible:
      id: 'map-settings-sheet'
    timeout: 10000
- swipe:
    start: '50%,90%'
    end: '50%,35%'
    duration: 500
    waitToSettleTimeoutMs: 0
- swipe:
    start: '50%,90%'
    end: '50%,35%'
    duration: 400
    waitToSettleTimeoutMs: 0
- extendedWaitUntil:
    visible:
      id: 'map-light-preset-option-auto'
    timeout: 10000
- assertVisible:
    id: 'offline-map-section-toggle'
- tapOn:
    id: 'map-light-preset-option-auto'
    retryTapIfNoChange: false
    waitToSettleTimeoutMs: 0
- assertVisible:
    id: 'map-light-preset-option-auto'
    selected: true
- tapOn:
    id: 'map-light-preset-option-night'
    retryTapIfNoChange: false
    waitToSettleTimeoutMs: 0
- assertVisible:
    id: 'map-light-preset-option-night'
    selected: true
- tapOn:
    id: 'map-light-preset-option-auto'
    retryTapIfNoChange: false
    waitToSettleTimeoutMs: 0
- assertVisible:
    id: 'map-light-preset-option-auto'
    selected: true
- swipe:
    start: '50%,88%'
    end: '50%,30%'
    duration: 500
    waitToSettleTimeoutMs: 0
- extendedWaitUntil:
    visible:
      id: 'offline-map-section-toggle'
    timeout: 10000
- assertVisible:
    id: 'map-settings-reset-button'
- takeScreenshot: ${MAESTRO_ARTIFACTS_DIR + '/daf-map-settings-scrolled'}
