appId: com.anonymous.drivefree.dev
name: Contribution Tour Resumes Unfinished Guidance
tags:
  - contribute
  - contribute-tour
  - map
---
- runFlow: subflows/contribute-tour-setup.yml
- runFlow: subflows/contribute-tour-place-camera.yml
- tapOn:
    id: 'contribute-next-details-button'
    retryTapIfNoChange: false
- runFlow:
    file: subflows/contribute-tour-tip.yml
    env:
      TOUR_STEP: camera-details
      TOUR_TITLE: Describe what you can verify
- extendedWaitUntil:
    visible:
      id: 'contribute-tour-manufacturer'
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: ${MAESTRO_ARTIFACTS_DIR + '/daf-contribute-tour-before-resume'}
# Restart with a real autosaved draft and a partially dismissed camera phase.
- runFlow: subflows/contribute-tour-relaunch.yml
- assertVisible:
    id: 'contribute-resume-draft-button'
- assertNotVisible:
    id: 'contribute-tour-start'
- tapOn:
    id: 'contribute-resume-draft-button'
    retryTapIfNoChange: false
- assertVisible: '1 camera placed'
- assertNotVisible:
    id: 'contribute-tour-placement-map|contribute-tour-placement|contribute-tour-placed'
- tapOn:
    id: 'contribute-next-details-button'
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible:
      id: 'contribute-tour-manufacturer'
    timeout: 10000
- assertNotVisible:
    id: 'contribute-tour-camera-details'
# Back reopens the earlier tip even when it was dismissed before restart.
- tapOn:
    id: 'contribute-tour-back-manufacturer'
    retryTapIfNoChange: false
- runFlow:
    file: subflows/contribute-tour-tip.yml
    env:
      TOUR_STEP: camera-details
      TOUR_TITLE: Describe what you can verify
- runFlow:
    file: subflows/contribute-tour-tip.yml
    env:
      TOUR_STEP: manufacturer
      TOUR_TITLE: Check the manufacturer
- runFlow:
    file: subflows/contribute-tour-tip.yml
    env:
      TOUR_STEP: operator
      TOUR_TITLE: Who runs this camera?
- runFlow:
    file: subflows/contribute-tour-tip.yml
    env:
      TOUR_STEP: directions
      TOUR_TITLE: Show where the camera looks
- runFlow:
    file: subflows/contribute-tour-tip.yml
    env:
      TOUR_STEP: mount
      TOUR_TITLE: What is it mounted on?
- assertVisible: 'Camera 1 of 1'
- tapOn:
    id: 'contribute-next-changeset-button'
    retryTapIfNoChange: false
- runFlow:
    file: subflows/contribute-tour-tip.yml
    env:
      TOUR_STEP: changeset
      TOUR_TITLE: Tell other mappers what changed
- runFlow:
    file: subflows/contribute-tour-tip.yml
    env:
      TOUR_STEP: source
      TOUR_TITLE: Where did the information come from?
- assertVisible:
    id: 'contribute-comment-input'
- assertVisible:
    id: 'contribute-next-review-button'
    enabled: false
