appId: com.anonymous.drivefree.dev
name: Contribute Signed Out Mocked
tags:
  - contribute
  - map
---
- setLocation:
    latitude: 30.26715
    longitude: -97.74035
- launchApp:
    stopApp: true
    permissions:
      all: allow
- extendedWaitUntil:
    visible:
      id: 'map-search-input-map'
    timeout: 30000
- openLink: 'driversagainstflock://e2e-mocks?auth=0'
- extendedWaitUntil:
    visible:
      id: 'map-search-input-map'
    timeout: 10000

# Without the auth mock the start sheet must show the signed-out card
- extendedWaitUntil:
    visible:
      id: 'map-contribute-button'
    timeout: 30000
- waitForAnimationToEnd
- assertNotVisible:
    id: 'contribute-start-sheet'
- tapOn:
    id: 'map-contribute-button'
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible:
      id: 'contribute-start-sheet'
    timeout: 30000
- assertVisible:
    id: 'contribute-start-sheet-title'
- assertVisible:
    id: 'contribute-account-card-signed-out'
- assertVisible:
    id: 'contribute-sign-in-button'
