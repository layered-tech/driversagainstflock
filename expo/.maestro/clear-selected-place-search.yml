appId: com.anonymous.drivefree.dev
name: Clear Selected Place Search Mocked
tags:
  - map
  - search
---
- setLocation:
    latitude: 30.2672
    longitude: -97.7431
- launchApp:
    stopApp: true
    permissions:
      all: allow
- runFlow:
    when:
      true: ${typeof MAESTRO_EXPO_DEV_CLIENT_URL !== 'undefined' && MAESTRO_EXPO_DEV_CLIENT_URL.length > 0}
    commands:
      - openLink: ${MAESTRO_EXPO_DEV_CLIENT_URL}
- runFlow:
    when:
      visible: 'http://10.0.2.2:8081'
    commands:
      - tapOn: 'http://10.0.2.2:8081'
- extendedWaitUntil:
    visible: 'Continue'
    timeout: 10000
    optional: true
- runFlow:
    when:
      visible: 'Continue'
    commands:
      - tapOn: 'Continue'
- extendedWaitUntil:
    visible: 'Close'
    timeout: 10000
    optional: true
- runFlow:
    when:
      visible: 'Close'
    commands:
      - tapOn:
          text: 'Close'
          optional: true
- tapOn:
    id: 'driving-cancel-route-button'
    optional: true
- tapOn:
    id: 'place-details-close-button'
    optional: true
- tapOn:
    id: 'exit-free-drive-button'
    optional: true
- extendedWaitUntil:
    visible:
      id: 'map-search-input-map'
    timeout: 30000
- openLink: 'driversagainstflock://e2e-mocks'
- extendedWaitUntil:
    visible:
      id: 'map-search-input-map'
    timeout: 10000

- tapOn:
    id: 'map-search-input-map'
- inputText: 'Austin Central Library'
- extendedWaitUntil:
    visible:
      id: 'map-search-result-0-map'
    timeout: 30000
- assertNotVisible:
    id: 'selected-place-sheet-presented'
- tapOn:
    id: 'map-search-result-0-map'
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: 'selected-place-sheet-presented'
    timeout: 30000
- assertVisible:
    id: 'selected-place-title'
- assertVisible:
    text: 'Austin Central Library'
- extendedWaitUntil:
    visible:
      id: 'place-details-close-button'
    timeout: 10000
- tapOn:
    id: 'place-details-close-button'
    retryTapIfNoChange: true
- extendedWaitUntil:
    notVisible:
      id: 'selected-place-sheet-presented'
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: 'map-search-directions-button-map'
    timeout: 10000
- assertVisible:
    id: 'map-search-directions-button-map'
