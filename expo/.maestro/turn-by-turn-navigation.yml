appId: com.anonymous.drivefree.dev
name: Turn-by-turn Navigation Guidance Mocked
tags:
  - map
  - directions
  - navigation
---
- setLocation:
    latitude: 30.2672
    longitude: -97.7431
- launchApp:
    stopApp: true
    clearState: true
    permissions:
      all: allow
- runFlow:
    when:
      platform: Android
    commands:
      - extendedWaitUntil:
          visible: 'New development server'
          timeout: 15000
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible: 'Enter URL manually'
          timeout: 15000
- waitForAnimationToEnd
- runFlow:
    when:
      true: ${typeof MAESTRO_EXPO_DEV_CLIENT_URL !== 'undefined' && MAESTRO_EXPO_DEV_CLIENT_URL.length > 0}
    commands:
      - openLink: ${MAESTRO_EXPO_DEV_CLIENT_URL}
- runFlow:
    when:
      visible:
        id: 'driving-cancel-route-button'
    commands:
      - tapOn:
          id: 'driving-cancel-route-button'
          retryTapIfNoChange: true
- runFlow:
    when:
      visible:
        id: 'place-details-close-button'
    commands:
      - tapOn:
          id: 'place-details-close-button'
          retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: 'map-search-input-map'
    timeout: 30000
- openLink: 'driversagainstflock://e2e-mocks'
- extendedWaitUntil:
    visible:
      id: 'map-search-directions-button-map'
    timeout: 10000
- setLocation:
    latitude: 30.2672
    longitude: -97.7431
- tapOn:
    id: 'map-search-directions-button-map'
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: 'map-directions-destination-input-map'
    timeout: 10000
- tapOn:
    id: 'map-directions-destination-input-map'
- inputText: 'Austin Central Library'
- extendedWaitUntil:
    visible:
      id: 'map-directions-search-result-0-map'
    timeout: 30000
- tapOn:
    id: 'map-directions-search-result-0-map'
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: 'map-directions-submit-button-map'
      enabled: true
    timeout: 30000
- assertNotVisible:
    id: 'directions-route-sheet-presented'
- tapOn:
    id: 'map-directions-submit-button-map'
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: 'directions-route-sheet-presented'
    timeout: 60000
- assertVisible:
    id: 'directions-route-option-ideal'
- tapOn:
    id: 'directions-route-option-ideal'
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: 'directions-route-option-ideal-selected-badge'
    timeout: 10000
- tapOn:
    id: 'directions-route-start-driving-button'
    retryTapIfNoChange: true
- extendedWaitUntil:
    notVisible:
      id: 'directions-route-sheet-presented'
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: 'driving-maneuver-card'
    timeout: 30000
- assertVisible:
    id: 'driving-maneuver-instruction'
- assertVisible: 'Turn right to avoid monitored intersections'
- assertVisible:
    id: 'driving-maneuver-next-step'
- assertVisible: 'then Arrive at your destination'
- assertVisible:
    id: 'driving-destination-card'
- assertVisible:
    id: 'driving-destination-title'
- assertVisible: 'Austin Central Library'
- tapOn:
    id: 'driving-cancel-route-button'
    retryTapIfNoChange: true
- runFlow:
    when:
      visible:
        id: 'place-details-close-button'
    commands:
      - tapOn:
          id: 'place-details-close-button'
          retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: 'map-search-input-map'
    timeout: 10000
