appId: com.anonymous.drivefree.dev
name: Route Choice Drag Mocked
tags:
  - map
  - directions
---
- setLocation:
    latitude: 30.2672
    longitude: -97.7431
- launchApp:
    stopApp: true
    permissions:
      all: allow
- runFlow:
    when:
      visible: 'Reload'
    commands:
      - tapOn:
          text: 'Reload'
          retryTapIfNoChange: false
# The teardown guards below only check the current frame, so wait for the app
# to finish booting into either the map or the driving shell first. A previous
# flow can leave free drive running, and that state survives a relaunch.
- extendedWaitUntil:
    visible:
      id: 'map-search-input-(map|driving)'
    timeout: 60000
- runFlow:
    when:
      visible:
        id: 'directions-route-back-button'
    commands:
      - tapOn:
          id: 'directions-route-back-button'
          retryTapIfNoChange: false
- runFlow:
    when:
      visible:
        id: 'marker-details-close-button'
    commands:
      - tapOn:
          id: 'marker-details-close-button'
          retryTapIfNoChange: false
- runFlow:
    when:
      visible:
        id: 'contribute-back-button'
    commands:
      - tapOn:
          id: 'contribute-back-button'
          retryTapIfNoChange: false
- runFlow:
    when:
      visible:
        id: 'driving-cancel-route-button'
    commands:
      - tapOn:
          id: 'driving-cancel-route-button'
          retryTapIfNoChange: true
- runFlow:
    when:
      visible:
        id: 'place-details-close-button'
    commands:
      - tapOn:
          id: 'place-details-close-button'
          retryTapIfNoChange: true
- runFlow:
    when:
      visible:
        id: 'exit-free-drive-button'
    commands:
      - tapOn:
          id: 'exit-free-drive-button'
          retryTapIfNoChange: true
- runFlow:
    when:
      visible:
        id: 'map-search-drawer-button-driving'
    commands:
      - tapOn:
          id: 'map-search-drawer-button-driving'
          retryTapIfNoChange: true
- runFlow:
    when:
      visible:
        id: 'exit-free-drive-button'
    commands:
      - tapOn:
          id: 'exit-free-drive-button'
          retryTapIfNoChange: true
- tapOn:
    id: 'exit-free-drive-button'
    optional: true
- openLink: 'driversagainstflock://e2e-mocks'
- extendedWaitUntil:
    visible:
      id: 'map-search-input-map'
    timeout: 30000
- openLink: 'driversagainstflock://e2e-mocks'
- extendedWaitUntil:
    visible:
      id: 'map-search-directions-button-map'
    timeout: 10000
- setLocation:
    latitude: 30.2672
    longitude: -97.7431

- tapOn:
    id: 'map-search-directions-button-map'
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: 'map-directions-destination-input-map'
    timeout: 10000
- tapOn:
    id: 'map-directions-destination-input-map'
- inputText: 'Austin Central Library'
- extendedWaitUntil:
    visible:
      id: 'map-directions-search-result-0-map'
    timeout: 30000
- tapOn:
    id: 'map-directions-search-result-0-map'
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: 'map-directions-submit-button-map'
      enabled: true
    timeout: 30000
- assertNotVisible:
    id: 'directions-route-sheet-presented'
- tapOn:
    id: 'map-directions-submit-button-map'
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: 'directions-route-sheet-presented'
    timeout: 60000
- assertVisible:
    id: 'directions-route-start-driving-button'

# Dragging the card up must not dismiss it — it stays open.
- swipe:
    start: '50%,64%'
    end: '50%,20%'
    duration: 700
- assertVisible:
    id: 'directions-route-sheet-presented'

# Dragging the card down must close it (same as the back arrow).
- swipe:
    start: '50%,64%'
    end: '50%,98%'
    duration: 900
- extendedWaitUntil:
    notVisible:
      id: 'directions-route-sheet-presented'
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: 'map-search-input-map'
    timeout: 10000
- assertNotVisible:
    id: 'directions-route-start-driving-button'
