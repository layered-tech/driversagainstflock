appId: com.anonymous.drivefree.dev
name: Marker OSM Details Toggle Mocked
tags:
  - map
  - markers
---
- setLocation:
    latitude: 30.26715
    longitude: -97.74035
- launchApp:
    clearState: true
    stopApp: true
    permissions:
      all: allow
- tapOn:
    text: 'Continue'
    optional: true
- runFlow:
    when:
      true: ${typeof MAESTRO_EXPO_DEV_CLIENT_URL !== 'undefined' && MAESTRO_EXPO_DEV_CLIENT_URL.length > 0}
    commands:
      - openLink: ${MAESTRO_EXPO_DEV_CLIENT_URL}
- runFlow:
    when:
      true: ${typeof MAESTRO_EXPO_DEV_SERVER_URL_PATTERN !== 'undefined' && MAESTRO_EXPO_DEV_SERVER_URL_PATTERN.length > 0}
    commands:
      - extendedWaitUntil:
          visible: ${MAESTRO_EXPO_DEV_SERVER_URL_PATTERN}
          timeout: 30000
          optional: true
      - runFlow:
          when:
            visible: ${MAESTRO_EXPO_DEV_SERVER_URL_PATTERN}
          commands:
            - tapOn:
                text: ${MAESTRO_EXPO_DEV_SERVER_URL_PATTERN}
                retryTapIfNoChange: false
- tapOn:
    text: 'http://10.0.2.2:8081'
    optional: true
- extendedWaitUntil:
    visible: 'Continue'
    timeout: 10000
    optional: true
- runFlow:
    when:
      visible: 'Continue'
    commands:
      - tapOn: 'Continue'
- extendedWaitUntil:
    visible: 'Close'
    timeout: 10000
    optional: true
- runFlow:
    when:
      visible: 'Close'
    commands:
      - tapOn:
          text: 'Close'
          optional: true
- extendedWaitUntil:
    visible:
      id: 'map-search-input-map'
    timeout: 30000
- openLink: 'driversagainstflock://e2e-mocks'
- extendedWaitUntil:
    visible:
      id: 'map-search-input-map'
    timeout: 10000
- setLocation:
    latitude: 30.26715
    longitude: -97.74035

- extendedWaitUntil:
    visible:
      id: 'map-marker-0-map'
    timeout: 60000
- assertNotVisible:
    id: 'marker-details-sheet-presented'
- tapOn:
    id: 'map-marker-0-map'
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: 'marker-details-sheet-presented'
    timeout: 30000
- assertVisible:
    id: 'marker-details-title'
- extendedWaitUntil:
    visible:
      id: 'marker-details-osm-id-value'
    timeout: 10000
- assertVisible:
    id: 'marker-details-manufacturer-value'
- assertVisible:
    id: 'marker-details-direction-value'
- assertVisible:
    id: 'marker-details-updated-value'
