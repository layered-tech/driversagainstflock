appId: com.anonymous.drivefree.dev
name: Free Drive Menu
tags:
  - drawer
  - map
---
- setLocation:
    latitude: 30.2672
    longitude: -97.7431
- launchApp:
    stopApp: true
    permissions:
      all: allow
- runFlow:
    when:
      true: ${typeof MAESTRO_EXPO_DEV_CLIENT_URL !== 'undefined' && MAESTRO_EXPO_DEV_CLIENT_URL.length > 0}
    commands:
      - openLink: ${MAESTRO_EXPO_DEV_CLIENT_URL}
- runFlow:
    when:
      visible:
        id: 'directions-route-back-button'
    commands:
      - tapOn:
          id: 'directions-route-back-button'
          retryTapIfNoChange: false
- runFlow:
    when:
      visible:
        id: 'place-details-close-button'
    commands:
      - tapOn:
          id: 'place-details-close-button'
          retryTapIfNoChange: false
- extendedWaitUntil:
    visible:
      id: 'map-search-input-map'
    timeout: 30000
- openLink: 'driversagainstflock://e2e-mocks'
- extendedWaitUntil:
    visible:
      id: 'map-search-input-map'
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: 'start-free-drive-button'
    timeout: 10000
- tapOn:
    id: 'start-free-drive-button'
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: 'map-search-input-driving'
    timeout: 10000
- assertNotVisible:
    id: 'app-drawer-open'
- tapOn:
    id: 'map-search-drawer-button-driving'
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible:
      id: 'app-drawer-open'
    timeout: 10000
- assertVisible:
    id: 'drawer-auth-login-button'
- pressKey: BACK
- extendedWaitUntil:
    notVisible:
      id: 'app-drawer-open'
    timeout: 10000
- tapOn:
    id: 'exit-free-drive-button'
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: 'map-search-input-map'
    timeout: 10000
