appId: com.anonymous.drivefree.dev
name: Place Details Drag Mocked
tags:
  - map
  - search
---
- setLocation:
    latitude: 30.2672
    longitude: -97.7431
- launchApp:
    stopApp: true
    permissions:
      all: allow
- extendedWaitUntil:
    visible:
      id: 'map-search-input-map'
    timeout: 30000
- openLink: 'driversagainstflock://e2e-mocks'
- extendedWaitUntil:
    visible:
      id: 'map-search-input-map'
    timeout: 10000

- tapOn:
    id: 'map-search-input-map'
- inputText: 'Barton Springs Pool'
- extendedWaitUntil:
    visible:
      id: 'map-search-result-0-map'
    timeout: 30000
- assertNotVisible:
    id: 'selected-place-sheet-presented'
- tapOn:
    id: 'map-search-result-0-map'
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: 'selected-place-sheet-presented'
    timeout: 30000
- assertVisible:
    id: 'selected-place-title'

# Dragging the card up must not dismiss it — it stays open.
- swipe:
    # The content-fit sheet starts near 82% on this fixture. Start on its
    # handle; the former 77% start landed on the map after the sheet shrank.
    start: '50%,83%'
    end: '50%,30%'
    duration: 700
- assertVisible:
    id: 'selected-place-sheet-presented'

# Dragging the card down must close it (same as tapping ✕).
- swipe:
    start: '50%,83%'
    end: '50%,98%'
    duration: 900
- extendedWaitUntil:
    notVisible:
      id: 'selected-place-sheet-presented'
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: 'map-search-input-map'
    timeout: 30000
- assertNotVisible:
    id: 'selected-place-title'
