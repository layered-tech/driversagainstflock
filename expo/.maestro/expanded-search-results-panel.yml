appId: com.anonymous.drivefree.dev
name: Expanded Search Results Panel Mocked
tags:
  - map
  - search
---
- setLocation:
    latitude: 30.2672
    longitude: -97.7431
- launchApp:
    stopApp: true
    permissions:
      all: allow
- extendedWaitUntil:
    visible:
      id: 'map-search-input-map'
    timeout: 30000
- openLink: 'driversagainstflock://e2e-mocks'
- extendedWaitUntil:
    visible:
      id: 'map-search-input-map'
    timeout: 10000
- setLocation:
    latitude: 30.2672
    longitude: -97.7431

- assertNotVisible:
    id: 'search-results-sheet-presented'
- assertNotVisible:
    id: 'selected-place-sheet-presented'
- tapOn:
    id: 'map-search-input-map'
    retryTapIfNoChange: false
- inputText: 'walmart'
- pressKey: Enter
- extendedWaitUntil:
    visible:
      id: 'search-results-sheet-presented'
    timeout: 30000
- assertVisible:
    id: 'submitted-search-result-0'
- assertVisible:
    id: 'submitted-search-result-count'
- assertVisible:
    text: '2 places for "walmart"'
- tapOn:
    id: 'submitted-search-result-0'
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: 'selected-place-sheet-presented'
    timeout: 30000
- extendedWaitUntil:
    notVisible:
      id: 'search-results-sheet-presented'
    timeout: 10000
- assertVisible:
    id: 'selected-place-title'
- assertVisible:
    text: 'Walmart Supercenter'
- extendedWaitUntil:
    visible:
      id: 'selected-place-back-to-results-button'
    timeout: 10000
- tapOn:
    id: 'selected-place-back-to-results-button'
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: 'search-results-sheet-presented'
    timeout: 30000
- extendedWaitUntil:
    notVisible:
      id: 'selected-place-sheet-presented'
    timeout: 10000
- assertVisible:
    id: 'submitted-search-result-1'
- tapOn:
    id: 'submitted-search-result-1'
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: 'selected-place-sheet-presented'
    timeout: 30000
- extendedWaitUntil:
    notVisible:
      id: 'search-results-sheet-presented'
    timeout: 10000
- assertVisible:
    id: 'selected-place-title'
- assertVisible:
    text: 'Walmart Neighborhood Market'
- assertVisible:
    text: '.*Grocery store.*'
