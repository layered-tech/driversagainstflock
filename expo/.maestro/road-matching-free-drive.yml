appId: com.anonymous.drivefree.dev
name: In-house Road Matching Free Drive
tags:
  - map
  - road-matching
  - speed-limit
---
- setLocation:
    latitude: 30.26698404060037
    longitude: -97.74466013819383
- launchApp:
    clearState: true
    clearKeychain: true
    stopApp: true
    permissions:
      all: allow
- runFlow:
    when:
      true: ${typeof MAESTRO_EXPO_DEV_CLIENT_URL !== 'undefined' && MAESTRO_EXPO_DEV_CLIENT_URL.length > 0}
    file: subflows/open-expo-dev-client-after-clear.yml
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: 'map-search-input-map'
    timeout: 30000
- openLink: 'driversagainstflock://e2e-mocks'
- extendedWaitUntil:
    visible:
      id: 'start-free-drive-button'
    timeout: 10000
- tapOn:
    id: 'start-free-drive-button'
    retryTapIfNoChange: true
- travel:
    points:
      - '30.26698404060037, -97.74466013819383'
      - '30.26698404060037, -97.74419209212921'
    # Maestro 1.40.3 double-converts radians while timing travel. This
    # compensated value delivers the route at roughly 10 m/s on Android.
    speed: 0.2
# Stop more than the watcher's 3 m distance interval before the proof point.
# Android also needs one full foreground-delivery cadence after Maestro's
# final travel step before the exact point is injected.
- runFlow:
    when:
      platform: Android
    commands:
      - extendedWaitUntil:
          visible:
            id: '__e2e-foreground-location-delivery-delay__'
          timeout: 1500
          optional: true
- setLocation:
    latitude: 30.26698404060037
    longitude: -97.74414009212921
- extendedWaitUntil:
    visible: '-97.7441401,30.2669840'
    timeout: 60000
- extendedWaitUntil:
    visible: 'e2e-main-35:0:forward'
    timeout: 30000
- copyTextFrom:
    id: 'e2e-road-matching-edge-id'
- assertTrue: ${maestro.copiedText == 'e2e-main-35:0:forward'}
- runFlow:
    when:
      visible:
        id: 'driving-recenter-button'
    commands:
      - tapOn:
          id: 'driving-recenter-button'
- extendedWaitUntil:
    visible: 'native-puck-proof-ready'
    timeout: 60000
- copyTextFrom:
    id: 'e2e-native-puck-proof'
- assertTrue: ${maestro.copiedText == 'true'}
- extendedWaitUntil:
    visible: 'native-puck-proof-ready'
    timeout: 60000
- copyTextFrom:
    id: 'e2e-native-3d-puck-proof'
- assertTrue: ${maestro.copiedText == 'true'}
- extendedWaitUntil:
    visible: '-97.7441401,30.2672000'
    timeout: 60000
- copyTextFrom:
    id: 'e2e-native-puck-kind'
- assertTrue: ${maestro.copiedText == '3d'}
- copyTextFrom:
    id: 'e2e-native-puck-model-uri'
- assertTrue: ${maestro.copiedText.match(/navigation_puck\.glb$/)}
- assertVisible:
    id: 'e2e-native-puck-model-scale'
- copyTextFrom:
    id: 'e2e-native-puck-model-rotation'
- assertTrue: ${maestro.copiedText == '0,0,0'}
- copyTextFrom:
    id: 'e2e-native-puck-scale-mode'
- assertTrue: ${maestro.copiedText == 'map'}
- copyTextFrom:
    id: 'e2e-native-puck-emissive-strength'
- assertTrue: ${maestro.copiedText == '1'}
- copyTextFrom:
    id: 'e2e-native-puck-cast-shadows'
- assertTrue: ${maestro.copiedText == 'false'}
- copyTextFrom:
    id: 'e2e-native-puck-receive-shadows'
- assertTrue: ${maestro.copiedText == 'false'}
- copyTextFrom:
    id: 'e2e-native-puck-location-enabled'
- assertTrue: ${maestro.copiedText == 'true'}
- copyTextFrom:
    id: 'e2e-native-puck-bearing'
- assertTrue: ${maestro.copiedText == 'heading'}
- copyTextFrom:
    id: 'e2e-native-puck-bearing-enabled'
- assertTrue: ${maestro.copiedText == 'true'}
- copyTextFrom:
    id: 'e2e-native-puck-model-layer'
- assertTrue: ${maestro.copiedText == 'true'}
- copyTextFrom:
    id: 'e2e-native-puck-model-source'
- assertTrue: ${maestro.copiedText == 'true'}
- copyTextFrom:
    id: 'e2e-native-puck-indicator-layer'
- assertTrue: ${maestro.copiedText == 'false'}
- copyTextFrom:
    id: 'e2e-native-puck-rendered-at-snapped'
- assertTrue: ${maestro.copiedText == 'true'}
- copyTextFrom:
    id: 'e2e-native-puck-model-byte-length'
- assertTrue: ${maestro.copiedText == '21636'}
- copyTextFrom:
    id: 'e2e-native-puck-model-sha256'
- assertTrue: ${maestro.copiedText == 'ab6a662ad8d0696f4a763ce364a1f73c0d4c5a56361baa4ab57644e85381fccc'}
- copyTextFrom:
    id: 'e2e-road-matching-state'
- assertTrue: ${maestro.copiedText == 'matched'}
- copyTextFrom:
    id: 'e2e-road-matching-source'
- assertTrue: ${maestro.copiedText == 'expo-foreground-location-watch'}
- copyTextFrom:
    id: 'e2e-road-matching-provider'
- assertTrue: ${maestro.copiedText == 'in-house-road-matcher'}
- copyTextFrom:
    id: 'e2e-road-matching-raw-coordinate'
- assertTrue: ${maestro.copiedText == '-97.7441401,30.2669840'}
- copyTextFrom:
    id: 'e2e-road-matching-coordinate'
- assertTrue: ${maestro.copiedText == '-97.7441401,30.2672000'}
- copyTextFrom:
    id: 'e2e-road-matching-speed-limit'
- assertTrue: ${maestro.copiedText == '35'}
- copyTextFrom:
    id: 'e2e-road-look-ahead-edge-ids'
- assertTrue: ${maestro.copiedText == 'e2e-main-35:0:forward,e2e-main-35:1:forward,e2e-main-45:0:forward'}
- copyTextFrom:
    id: 'e2e-native-puck-provider-owned'
- assertTrue: ${maestro.copiedText == 'true'}
- copyTextFrom:
    id: 'e2e-native-puck-camera-following'
- assertTrue: ${maestro.copiedText == 'true'}
- runFlow:
    when:
      platform: Android
    commands:
      - copyTextFrom:
          id: 'e2e-native-puck-provider-coordinate'
      - assertTrue: ${maestro.copiedText == '-97.7441401,30.2672000'}
      - copyTextFrom:
          id: 'e2e-native-puck-provider-at-snapped'
      - assertTrue: ${maestro.copiedText == 'true'}
      - copyTextFrom:
          id: 'e2e-native-puck-provider-at-raw'
      - assertTrue: ${maestro.copiedText == 'false'}
      - copyTextFrom:
          id: 'e2e-native-puck-proof-source'
      - assertTrue: ${maestro.copiedText == 'native-3d-puck'}
      - copyTextFrom:
          id: 'e2e-native-puck-indicator-coordinate'
      - assertTrue: ${Math.abs(Number(maestro.copiedText.split(',')[0]) - -97.7441401) <= 0.0001 && Math.abs(Number(maestro.copiedText.split(',')[1]) - 30.2672) <= 0.000001}
- runFlow:
    when:
      platform: iOS
    commands:
      - copyTextFrom:
          id: 'e2e-native-puck-proof-source'
      - assertTrue: ${maestro.copiedText == 'rendered-query-3d'}
- copyTextFrom:
    id: 'driving-speed-limit-value'
- assertTrue: ${maestro.copiedText == '35'}
- pressKey: Home
- travel:
    points:
      - '30.26698404060037, -97.74414009212921'
      - '30.26698404060037, -97.7389396314831'
    # Maestro 1.40.3 underestimates path distance, so use a lower simulation
    # speed to keep the app backgrounded long enough for a task delivery.
    speed: 1
- extendedWaitUntil:
    visible:
      id: '__e2e-background-settle-delay__'
    timeout: 10000
    optional: true
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible: 'e2e-main-45:0:forward'
    timeout: 30000
- copyTextFrom:
    id: 'e2e-road-matching-edge-id'
- assertTrue: ${maestro.copiedText == 'e2e-main-45:0:forward'}
- copyTextFrom:
    id: 'e2e-road-matching-background-delivery'
- assertTrue: ${maestro.copiedText == 'background'}
- copyTextFrom:
    id: 'e2e-road-matching-background-raw-coordinate'
- assertTrue: ${maestro.copiedText == '-97.7389396,30.2669840'}
- copyTextFrom:
    id: 'e2e-road-matching-background-edge-id'
- assertTrue: ${maestro.copiedText == 'e2e-main-45:0:forward'}
- copyTextFrom:
    id: 'e2e-road-matching-background-coordinate'
- assertTrue: ${maestro.copiedText == '-97.7389396,30.2672000'}
- copyTextFrom:
    id: 'e2e-road-matching-background-speed-limit'
- assertTrue: ${maestro.copiedText == '45'}
- runFlow:
    when:
      visible:
        id: 'driving-recenter-button'
    commands:
      - tapOn:
          id: 'driving-recenter-button'
- extendedWaitUntil:
    visible: 'native-puck-proof-ready'
    timeout: 60000
- copyTextFrom:
    id: 'e2e-native-puck-proof'
- assertTrue: ${maestro.copiedText == 'true'}
- extendedWaitUntil:
    visible: 'native-puck-proof-ready'
    timeout: 60000
- copyTextFrom:
    id: 'e2e-native-3d-puck-proof'
- assertTrue: ${maestro.copiedText == 'true'}
- copyTextFrom:
    id: 'e2e-native-puck-kind'
- assertTrue: ${maestro.copiedText == '3d'}
- copyTextFrom:
    id: 'e2e-native-puck-model-uri'
- assertTrue: ${maestro.copiedText.match(/navigation_puck\.glb$/)}
- assertVisible:
    id: 'e2e-native-puck-model-scale'
- copyTextFrom:
    id: 'e2e-native-puck-model-layer'
- assertTrue: ${maestro.copiedText == 'true'}
- copyTextFrom:
    id: 'e2e-native-puck-model-source'
- assertTrue: ${maestro.copiedText == 'true'}
- copyTextFrom:
    id: 'e2e-native-puck-indicator-layer'
- assertTrue: ${maestro.copiedText == 'false'}
- copyTextFrom:
    id: 'e2e-native-puck-rendered-at-snapped'
- assertTrue: ${maestro.copiedText == 'true'}
- copyTextFrom:
    id: 'e2e-native-puck-model-sha256'
- assertTrue: ${maestro.copiedText == 'ab6a662ad8d0696f4a763ce364a1f73c0d4c5a56361baa4ab57644e85381fccc'}
- copyTextFrom:
    id: 'e2e-road-matching-coordinate'
- assertTrue: ${maestro.copiedText == '-97.7389396,30.2672000'}
- copyTextFrom:
    id: 'e2e-road-matching-raw-coordinate'
- assertTrue: ${maestro.copiedText == '-97.7389396,30.2669840'}
- copyTextFrom:
    id: 'e2e-native-puck-provider-owned'
- assertTrue: ${maestro.copiedText == 'true'}
- copyTextFrom:
    id: 'e2e-native-puck-camera-following'
- assertTrue: ${maestro.copiedText == 'true'}
- runFlow:
    when:
      platform: Android
    commands:
      - copyTextFrom:
          id: 'e2e-native-puck-provider-coordinate'
      - assertTrue: ${maestro.copiedText == '-97.7389396,30.2672000'}
      - copyTextFrom:
          id: 'e2e-native-puck-provider-at-snapped'
      - assertTrue: ${maestro.copiedText == 'true'}
      - copyTextFrom:
          id: 'e2e-native-puck-provider-at-raw'
      - assertTrue: ${maestro.copiedText == 'false'}
      - copyTextFrom:
          id: 'e2e-native-puck-proof-source'
      - assertTrue: ${maestro.copiedText == 'native-3d-puck'}
      - copyTextFrom:
          id: 'e2e-native-puck-indicator-coordinate'
      - assertTrue: ${Math.abs(Number(maestro.copiedText.split(',')[0]) - -97.7389396) <= 0.0001 && Math.abs(Number(maestro.copiedText.split(',')[1]) - 30.2672) <= 0.000001}
- runFlow:
    when:
      platform: iOS
    commands:
      - copyTextFrom:
          id: 'e2e-native-puck-proof-source'
      - assertTrue: ${maestro.copiedText == 'rendered-query-3d'}
- copyTextFrom:
    id: 'e2e-road-matching-speed-limit'
- assertTrue: ${maestro.copiedText == '45'}
- copyTextFrom:
    id: 'driving-speed-limit-value'
- assertTrue: ${maestro.copiedText == '45'}
- copyTextFrom:
    id: 'e2e-road-look-ahead-edge-ids'
- assertTrue: ${maestro.copiedText == 'e2e-main-45:0:forward'}
- takeScreenshot: ${MAESTRO_ARTIFACTS_DIR + '/daf-in-house-road-matching-free-drive'}
