appId: com.anonymous.drivefree.dev
name: Shared Addition And Removal Changeset
tags:
  - map
  - contribute
  - shared-changeset
---
- setLocation:
    latitude: 30.26715
    longitude: -97.74035
- launchApp:
    clearState: true
    stopApp: true
    permissions:
      all: allow
- runFlow:
    when:
      true: ${typeof MAESTRO_EXPO_DEV_CLIENT_URL !== 'undefined' && MAESTRO_EXPO_DEV_CLIENT_URL.length > 0}
    file: subflows/open-expo-dev-client-after-clear.yml
- extendedWaitUntil:
    visible:
      id: 'map-search-input-(map|driving)'
    timeout: 120000
- runFlow:
    when:
      visible:
        id: 'exit-free-drive-button'
    commands:
      - tapOn:
          id: 'exit-free-drive-button'
          retryTapIfNoChange: false
- extendedWaitUntil:
    visible:
      id: 'map-search-input-map'
    timeout: 120000
- openLink: 'driversagainstflock://e2e-mocks?auth=1'
- extendedWaitUntil:
    visible:
      id: 'map-marker-0-map'
    timeout: 60000
- tapOn:
    id: 'map-marker-0-map'
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible:
      id: 'marker-details-delete-node-button'
    timeout: 10000
- tapOn:
    id: 'marker-details-delete-node-button'
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible:
      id: 'remove-camera-sheet'
    timeout: 10000
- tapOn:
    id: 'remove-camera-confirm-button'
- runFlow:
    when:
      visible:
        id: 'contribute-tour-changeset'
    commands:
      - tapOn:
          id: 'contribute-tour-skip-changeset'
          retryTapIfNoChange: false
          waitToSettleTimeoutMs: 0
- extendedWaitUntil:
    visible:
      id: 'contribute-changeset-details-screen'
    timeout: 10000
- tapOn:
    id: 'contribute-continue-map-button'
- extendedWaitUntil:
    visible:
      id: 'map-contribute-button'
    timeout: 10000
- tapOn:
    id: 'map-contribute-button'
- runFlow:
    when:
      visible:
        id: 'contribute-tour-start'
    commands:
      - tapOn:
          id: 'contribute-tour-skip-start'
          retryTapIfNoChange: false
- extendedWaitUntil:
    visible:
      id: 'contribute-start-editing-button'
    timeout: 10000
- tapOn:
    id: 'contribute-start-editing-button'
- extendedWaitUntil:
    visible:
      id: 'contribute-add-camera-button'
    timeout: 10000
- tapOn:
    id: 'contribute-add-camera-button'
- tapOn:
    id: 'contribute-next-details-button'
- extendedWaitUntil:
    visible:
      id: 'contribute-camera-details-screen'
    timeout: 10000
- tapOn:
    id: 'contribute-next-changeset-button'
- extendedWaitUntil:
    visible:
      id: 'contribute-changeset-details-screen'
    timeout: 10000
- assertVisible: '.*2 nodes.*'
- tapOn:
    id: 'contribute-comment-input'
- inputText: 'Survey: add a camera and remove a missing one'
- hideKeyboard
- tapOn:
    id: 'contribute-next-review-button'
- extendedWaitUntil:
    visible:
      id: 'contribute-review-removal-1234567890'
    timeout: 10000
- assertVisible: 'Added ALPR camera · Flock Safety'
- tapOn:
    id: 'contribute-publish-button'
- extendedWaitUntil:
    visible:
      id: 'contribute-published-screen'
    timeout: 10000
- assertVisible: 'Changeset published'
- assertVisible: 'Removed camera'
- assertVisible: 'ALPR camera · Flock Safety'
- assertVisible:
    id: 'contribute-published-node-1'
- tapOn:
    id: 'contribute-see-on-map-button'
- openLink: 'driversagainstflock://edits/1234567890'
- extendedWaitUntil:
    visible:
      id: 'edit-camera-deleted-message'
    timeout: 10000
