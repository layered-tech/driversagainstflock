appId: com.anonymous.drivefree.dev
name: Shared Addition And Removal Changeset
tags:
  - map
  - contribute
  - shared-changeset
---
- runFlow: subflows/contribute-tour-setup.yml
- tapOn:
    id: 'contribute-tour-skip-start'
    retryTapIfNoChange: false
- tapOn:
    id: 'contribute-start-editing-button'
    retryTapIfNoChange: false
- tapOn:
    id: 'map-marker-0-map'
    retryTapIfNoChange: false
- tapOn:
    id: 'marker-details-delete-node-button'
    retryTapIfNoChange: false
- assertVisible:
    id: 'remove-camera-sheet'
- tapOn:
    id: 'remove-camera-confirm-button'
    retryTapIfNoChange: false
- assertVisible: '1 change staged'
- tapOn:
    id: 'contribute-keep-editing'
    retryTapIfNoChange: false
- tapOn:
    id: 'contribute-add-camera-button'
    retryTapIfNoChange: false
- assertVisible:
    id: 'contribute-camera-details-screen'
- tapOn:
    id: 'contribute-next-changeset-button'
    retryTapIfNoChange: false
- assertVisible: '2 changes staged'
- tapOn:
    id: 'contribute-next-details-button'
    retryTapIfNoChange: false
- assertVisible: '2 changes'
- tapOn:
    id: 'contribute-comment-input'
- inputText: 'Survey: add a camera and remove a missing one'
- tapOn:
    text: 'Say what changed and why — other mappers read this.'
    retryTapIfNoChange: false
- tapOn:
    id: 'contribute-next-review-button'
    retryTapIfNoChange: false
- assertVisible:
    id: 'contribute-review-removal-1234567890'
- assertVisible: 'Create · ALPR reader · Flock Safety'
- tapOn:
    id: 'contribute-publish-button'
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible:
      id: 'contribute-published-screen'
    timeout: 10000
- assertVisible: 'Changeset published'
- assertVisible: created
- assertVisible: deleted
- assertVisible:
    id: 'contribute-published-node-1'
- tapOn:
    id: 'contribute-see-on-map-button'
    retryTapIfNoChange: false
- assertNotVisible:
    id: 'contribute-draft-count'
