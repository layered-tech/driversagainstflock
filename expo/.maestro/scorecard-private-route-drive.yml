appId: com.anonymous.drivefree.dev
name: Scorecard Private Route Drive
tags:
  - scorecard
  - navigation
  - privacy
---
- setLocation:
    latitude: 30.2672
    longitude: -97.7431
- launchApp:
    clearKeychain: true
    clearState: true
    stopApp: true
    permissions:
      all: allow
- runFlow:
    when:
      true: ${typeof MAESTRO_EXPO_DEV_CLIENT_URL !== 'undefined' && MAESTRO_EXPO_DEV_CLIENT_URL.length > 0}
    file: subflows/open-expo-dev-client-after-clear.yml
- extendedWaitUntil:
    visible:
      id: 'map-search-input-map'
    timeout: 30000
- openLink: 'driversagainstflock://e2e-mocks?scorecardDrive=private-route'
- extendedWaitUntil:
    visible:
      id: 'map-search-directions-button-map'
    timeout: 10000
- setLocation:
    latitude: 30.2672
    longitude: -97.7431
- tapOn:
    id: 'map-search-directions-button-map'
    retryTapIfNoChange: true
    waitToSettleTimeoutMs: 1000
- extendedWaitUntil:
    visible:
      id: 'map-directions-destination-input-map'
    timeout: 10000
- tapOn:
    id: 'map-directions-destination-input-map'
    waitToSettleTimeoutMs: 1000
- inputText: 'Austin Central Library'
- extendedWaitUntil:
    visible:
      id: 'map-directions-search-result-0-map'
    timeout: 30000
- tapOn:
    id: 'map-directions-search-result-0-map'
    retryTapIfNoChange: true
    waitToSettleTimeoutMs: 1000
- extendedWaitUntil:
    visible:
      id: 'map-directions-submit-button-map'
      enabled: true
    timeout: 30000
- tapOn:
    id: 'map-directions-submit-button-map'
    retryTapIfNoChange: true
    waitToSettleTimeoutMs: 1000
- extendedWaitUntil:
    visible:
      id: 'directions-route-sheet-presented'
    timeout: 60000

# Prove the drive starts from a two-camera fastest route before selecting the
# camera-free private alternative.
- assertVisible:
    id: 'directions-route-option-direct'
- assertVisible:
    id: 'directions-route-option-ideal'
- copyTextFrom:
    id: 'directions-route-option-direct-camera-count'
- assertTrue: ${maestro.copiedText == '2 cameras'}
- copyTextFrom:
    id: 'directions-route-option-ideal-camera-count'
- assertTrue: ${maestro.copiedText == 'No cameras'}
- tapOn:
    id: 'directions-route-option-direct'
    retryTapIfNoChange: true
    waitToSettleTimeoutMs: 1000
- extendedWaitUntil:
    visible:
      id: 'directions-route-option-direct-selected-badge'
    timeout: 10000
- tapOn:
    id: 'directions-route-option-ideal'
    retryTapIfNoChange: true
    waitToSettleTimeoutMs: 1000
- extendedWaitUntil:
    visible:
      id: 'directions-route-option-ideal-selected-badge'
    timeout: 10000
- tapOn:
    id: 'directions-route-start-driving-button'
    retryTapIfNoChange: true
    waitToSettleTimeoutMs: 1000
- extendedWaitUntil:
    notVisible:
      id: 'directions-route-sheet-presented'
    timeout: 10000
- extendedWaitUntil:
    visible: 'expo-foreground-location-watch'
    timeout: 30000
- extendedWaitUntil:
    visible: 'scorecard-hydrated'
    timeout: 30000
- extendedWaitUntil:
    visible: 'scorecard-guided-active'
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: 'e2e-scorecard-storage-synced'
    timeout: 30000
- copyTextFrom:
    id: 'e2e-scorecard-persisted-revision'
- assertTrue: ${Number(maestro.copiedText) > 0}

# The private route remains outside both fastest-route camera regions. The
# user ends guidance near the destination before automatic arrival fires;
# completion must still settle the camera difference locked at Start.
- travel:
    points:
      - '30.2672, -97.7431'
      - '30.26884, -97.74484'
      - '30.267860475422783, -97.74957436878988'
    speed: 0.2
- runFlow:
    when:
      platform: Android
    commands:
      - extendedWaitUntil:
          visible:
            id: '__e2e-scorecard-waypoint-delivery-delay__'
          timeout: 1500
          optional: true
- setLocation:
    latitude: 30.26785
    longitude: -97.749625
- extendedWaitUntil:
    visible: '-97.7496250,30.2678500'
    timeout: 30000
- travel:
    points:
      - '30.26785, -97.749625'
      - '30.265887553929062, -97.75112136512908'
    speed: 0.2
- runFlow:
    when:
      platform: Android
    commands:
      - extendedWaitUntil:
          visible:
            id: '__e2e-scorecard-waypoint-delivery-delay__'
          timeout: 1500
          optional: true
- setLocation:
    latitude: 30.26585
    longitude: -97.75115
- extendedWaitUntil:
    visible: '-97.7511500,30.2658500'
    timeout: 30000
- travel:
    points:
      - '30.26585, -97.75115'
      - '30.26578, -97.75125'
      - '30.26573, -97.75132'
    speed: 0.08
- tapOn:
    id: 'driving-cancel-route-button'
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: 'scorecard-arrival-recap'
    timeout: 60000
- assertVisible: 'Route ended, unseen'
- copyTextFrom:
    id: 'scorecard-arrival-recap-score'
- assertTrue: ${maestro.copiedText == 'Privacy score → 100'}
- copyTextFrom:
    id: 'scorecard-arrival-recap-avoided'
- assertTrue: ${maestro.copiedText == '2'}
- copyTextFrom:
    id: 'scorecard-arrival-recap-crossings'
- assertTrue: ${maestro.copiedText == '0'}
- copyTextFrom:
    id: 'scorecard-arrival-recap-xp'
- assertTrue: ${maestro.copiedText == '+90 XP'}
- extendedWaitUntil:
    visible:
      id: 'e2e-scorecard-storage-synced'
    timeout: 30000
- copyTextFrom:
    id: 'e2e-scorecard-persisted-revision'
- assertTrue: ${Number(maestro.copiedText) > 0}

# Relaunch without clearing either app data or the keychain. The pending recap
# and dashboard totals must hydrate from the encrypted device-local state.
- launchApp:
    stopApp: true
    permissions:
      all: allow
- extendedWaitUntil:
    visible:
      id: 'scorecard-arrival-recap'
    timeout: 30000
- copyTextFrom:
    id: 'scorecard-arrival-recap-avoided'
- assertTrue: ${maestro.copiedText == '2'}
- copyTextFrom:
    id: 'scorecard-arrival-recap-xp'
- assertTrue: ${maestro.copiedText == '+90 XP'}
- tapOn:
    id: 'scorecard-arrival-recap-done'
    retryTapIfNoChange: true
- tapOn:
    id: 'map-search-drawer-button-map'
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible:
      id: 'app-drawer-open'
    timeout: 10000
- tapOn:
    id: 'drawer-scorecard-button'
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: 'scorecard-dashboard'
    timeout: 10000
- copyTextFrom:
    id: 'scorecard-privacy-score'
- assertTrue: ${maestro.copiedText == '100'}
- copyTextFrom:
    id: 'scorecard-stat-avoided'
- assertTrue: ${maestro.copiedText == '2'}
- copyTextFrom:
    id: 'scorecard-stat-crossings'
- assertTrue: ${maestro.copiedText == '0'}
- copyTextFrom:
    id: 'scorecard-level-xp'
- assertTrue: ${maestro.copiedText == '90 XP'}
- tapOn:
    id: 'scorecard-stat-crossings'
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: 'scorecard-timeline'
    timeout: 10000
- assertVisible: '0 confirmed · 0 possible · 2 avoided'
- takeScreenshot: ${MAESTRO_ARTIFACTS_DIR + '/daf-scorecard-private-route-drive'}
