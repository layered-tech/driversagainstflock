appId: com.anonymous.drivefree.dev
name: Hotlist Mocked
tags:
  - hotlist
  - drawer
---
- setLocation:
    latitude: 30.2672
    longitude: -97.7431
- launchApp:
    stopApp: true
    permissions:
      all: allow
- extendedWaitUntil:
    visible:
      id: 'map-search-input-map'
    timeout: 30000
- openLink: 'driversagainstflock://e2e-mocks'
- extendedWaitUntil:
    visible:
      id: 'map-search-drawer-button-map'
    timeout: 10000

- assertNotVisible:
    id: 'app-drawer-open'
- tapOn:
    id: 'map-search-drawer-button-map'
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible:
      id: 'app-drawer-open'
    timeout: 10000
- assertVisible: 'Hotlist'
- assertVisible:
    id: 'drawer-auth-login-button'
- tapOn: 'Hotlist'
- extendedWaitUntil:
    notVisible:
      id: 'app-drawer-open'
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: 'hotlist-screen'
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: 'hotlist-drawer-button'
    timeout: 10000
- assertVisible: 'Recently added'
- assertVisible: '7 days'
- assertVisible: 'All · 38'
- assertVisible: 'Flock · 21'
- assertVisible:
    id: 'hotlist-row-0'
- assertVisible: '16th St & Mission St'
- assertVisible: 'node/11820431'
- assertVisible: 'Data from OpenStreetMap contributors'
- tapOn:
    id: 'hotlist-drawer-button'
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible:
      id: 'app-drawer-open'
    timeout: 10000
- assertVisible: 'Map'
- tapOn: 'Map'
- extendedWaitUntil:
    notVisible:
      id: 'app-drawer-open'
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: 'map-search-input-map'
    timeout: 10000
